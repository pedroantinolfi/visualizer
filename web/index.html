<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Structures Visualizer</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 40px; background-color: #1e1e1e; color: #fff; }
        .hidden { display: none !important; }
        
        /* Menu Styles */
        .menu-container { margin-top: 50px; }
        .menu-btn { padding: 15px 30px; font-size: 18px; margin: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .menu-btn:hover { background-color: #45a049; }
        .menu-btn:disabled { background-color: #555; cursor: not-allowed; }
        
        /* Workspace Styles */
        canvas { border: 1px solid #555; margin-top: 20px; background-color: #252526; border-radius: 8px; }
        .controls { margin-top: 20px; }
        input, button { padding: 10px; font-size: 16px; margin: 5px; border-radius: 5px; border: none; }
        input { background-color: #333; color: white; border: 1px solid #555; }
        .action-btn { background-color: #0e639c; color: white; cursor: pointer; font-weight: bold; }
        .action-btn:hover { background-color: #1177bb; }
        .back-btn { background-color: #d32f2f; color: white; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        .back-btn:hover { background-color: #b71c1c; }
    </style>
</head>
<body>
    <!-- Main Menu -->
    <div id="mainMenu" class="menu-container">
        <h2>Select Data Structure</h2>
        <button class="menu-btn" id="btnMenuQueue">List Queue</button>
        <button class="menu-btn" id="btnMenuAVL" disabled>AVL Tree (Coming Soon)</button>
    </div>

    <!-- Visualizer Workspace -->
    <div id="visualizerWorkspace" class="hidden">
        <button id="btnBackToMenu" class="back-btn">Back to Menu</button>
        <h2 id="workspaceTitle">Visualizer</h2>
        
        <!-- Queue Controls -->
        <div id="controlsQueue" class="controls hidden">
            <input type="text" id="inputQueue" placeholder="Value to enqueue">
            <button id="btnEnqueue" class="action-btn">Enqueue</button>
            <button id="btnDequeue" class="action-btn">Dequeue</button>
        </div>
        
        <!-- AVL Controls (Ready for next step) -->
        <div id="controlsAVL" class="controls hidden">
            <input type="number" id="inputAVL" placeholder="Value to insert">
            <button id="btnInsertAVL" class="action-btn">Insert</button>
        </div>

        <canvas id="canvas" width="800" height="400"></canvas>
    </div>

    <script src="wasm_exec.js"></script>
    <script src="app.js"></script>
</body>
</html>
